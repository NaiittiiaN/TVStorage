name: Android CI & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/TV_Storage.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/TV_Storage.apk
          name: Release ${{ github.ref_name }}
          body: |
            Автоматическая сборка TV Storage v${{ github.ref_name }}
            
            Изменения в этой версии:
            - Удален функционал фото
            - Переименование в S/N
            - Полноценный веб-интерфейс
            - Исправлен расчет стоимости
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
